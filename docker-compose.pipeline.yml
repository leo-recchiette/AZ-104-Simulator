# Nome diverso da quello del compose principale (az-104-simulator): il teardown fa `down -v`,
# che con lo stesso nome cancellerebbe il volume del database e lo storico delle sessioni.
name: az-104-simulator-pipeline

services:
  build:
    container_name: az-104-simulator-pipeline
    tty: true
    build:
      context: .
      dockerfile: pipeline.dockerfile
    volumes:
      - .:/work
      # node_modules in un volume anonimo, cosi' npm ci non lo scrive sull'host.
      - /work/src/AZ-104.Simulator.Web/node_modules
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=simulator_tests;Username=simulator;Password=simulator
    depends_on:
      db:
        condition: service_healthy

  # Database dei test di integrazione: nessuna porta esposta, per non toccare il 5432 di sviluppo.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator
      POSTGRES_DB: simulator_tests
    volumes:
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator -d simulator_tests"]
      interval: 2s
      retries: 30

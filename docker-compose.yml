name: az-104-simulator

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator
      POSTGRES_DB: simulator
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Eseguito solo alla prima creazione del volume. Su un database esistente le modifiche allo
      # schema vanno applicate a mano: ricreare il volume (down -v) cancellerebbe anche lo storico.
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator -d simulator"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Import del question bank: si lancia a mano, col profilo setup.
  importer:
    build:
      context: .
      dockerfile: src/AZ-104.Simulator.Importer/Dockerfile
    image: az-104-questions-importer
    container_name: az-104-questions-importer
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgresql://simulator:simulator@db:5432/simulator
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/AZ-104.Simulator.Api/Dockerfile
    image: az-104-simulator-api
    container_name: az-104-simulator-api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=simulator;Username=simulator;Password=simulator
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/AZ-104.Simulator.Web
      dockerfile: Dockerfile
    image: az-104-simulator-web
    container_name: az-104-simulator-web
    environment:
      VITE_API_BASE_URL: http://localhost:5080
    volumes:
      - ./src/AZ-104.Simulator.Web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  # Client SQL su http://localhost:8081: docker compose --profile dev up -d pgweb.
  # Un down/stop senza --profile dev lo ignora: va nominato (stop pgweb) o ripetuto il profilo.
  pgweb:
    image: sosedoff/pgweb:latest
    profiles: ["dev"]
    environment:
      PGWEB_DATABASE_URL: postgresql://simulator:simulator@db:5432/simulator?sslmode=disable
    # --lock-session: la UI usa la connessione aperta all'avvio e non chiede credenziali.
    command: ["--bind=0.0.0.0", "--listen=8081", "--lock-session"]
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  web_node_modules:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: examinator
      POSTGRES_PASSWORD: examinator
      POSTGRES_DB: examinator
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Eseguito solo alla prima creazione del volume. Su un database esistente le modifiche allo
      # schema vanno applicate a mano: ricreare il volume (down -v) cancellerebbe anche lo storico.
      - ./AZ-104.Examinator.Database/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examinator -d examinator"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Import una tantum del question bank
  importer:
    build:
      context: .
      dockerfile: AZ-104.Examinator.Database/database-importer/Dockerfile
    image: az-104-questions-importer
    container_name: az-104-questions-importer
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgresql://examinator:examinator@db:5432/examinator
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: AZ-104.Examinator.BE/AZ-104.Examinator.Api/Dockerfile
    image: az-104-examinator-api
    container_name: az-104-examinator-api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=examinator;Username=examinator;Password=examinator
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./AZ-104.Examinator.FE
      dockerfile: Dockerfile
    image: az-104-examinator-web
    container_name: az-104-examinator-web
    environment:
      VITE_API_BASE_URL: http://localhost:5080
    volumes:
      - ./AZ-104.Examinator.FE:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  # Client SQL via browser su http://localhost:8081, niente da installare.
  #   docker compose --profile dev up -d pgweb
  # ATTENZIONE: essendo dietro profilo, un 'docker compose stop' o 'down' NUDO
  # (senza --profile dev) lo ignora del tutto e lo lascia acceso. Per fermarlo
  # o rimuoverlo va nominato esplicitamente o richiamato lo stesso profilo:
  #   docker compose stop pgweb            (nominarlo basta, anche senza --profile)
  #   docker compose --profile dev down    (per una pulizia completa)
  pgweb:
    image: sosedoff/pgweb:latest
    profiles: ["dev"]
    environment:
      PGWEB_DATABASE_URL: postgresql://examinator:examinator@db:5432/examinator?sslmode=disable
    # --lock-session aggancia la sessione del browser alla connessione aperta
    # all'avvio, cosi' la UI non chiede le credenziali.
    command: ["--bind=0.0.0.0", "--listen=8081", "--lock-session"]
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  web_node_modules:
